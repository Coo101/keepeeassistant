# CI/CD for KeePeeAssistant on the homelab (Gitea Actions).
#   test   — every push/PR, normal runner (no Docker socket): ruff, black, Django checks, pytest
#   branch-guard — PRs only: a PR into main must come from dev (required check on main)
#   deploy — pushes to main only, user-scoped runner `docker-deploy` (has the host's
#            Docker socket): build image -> push to Gitea's registry -> compose pull/up
#            of the homelab stack /home/claude/stacks/keepeeassistant (homelab repo:
#            stacks/keepeeassistant). Rollback = pin an older :<sha> tag in that stack.
# Needs the repo secret REGISTRY_TOKEN (Gitea token, scope package:write).
name: ci-cd

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: gitea.dk-1.home.zx:3000
  IMAGE: gitea.dk-1.home.zx:3000/myverlinden/keepeeassistant
  # Owner of the REGISTRY_TOKEN secret (the registry wants the token's own user name).
  REGISTRY_USER: yonick_git
  STACK: /home/claude/stacks/keepeeassistant/compose.yml

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # No secrets in CI: debug mode is the only way settings start without a key.
      DJANGO_DEBUG: "1"
      DJANGO_DATA_DIR: /tmp/data
    steps:
      - uses: actions/checkout@v4

      - name: Python env
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r requirements.txt -r requirements-dev.txt
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: ruff
        run: |
          ruff check .
          black --check .

      - name: Django checks
        run: |
          mkdir -p /tmp/data
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: pytest
        run: python -m pytest -q

  branch-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev may be merged into main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::A PR into main must come from dev, not '$HEAD'. Open it against dev instead."
            exit 1
          fi
          echo "ok: $HEAD -> $BASE"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: docker-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Registry login
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build
        run: |
          docker build --pull \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Check the image renders PDFs
        run: |
          docker run --rm --entrypoint python "$IMAGE:${{ github.sha }}" -c \
            "from weasyprint import HTML; assert HTML(string='<p>test</p>').write_pdf()[:4] == b'%PDF'"

      - name: Push
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy (compose pull + up)
        run: |
          test -f "$STACK" || { echo "::error::$STACK missing — deploy the homelab stack 'keepeeassistant' first"; exit 1; }
          docker compose -p keepeeassistant -f "$STACK" pull
          docker compose -p keepeeassistant -f "$STACK" up -d

      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' keepeeassistant 2>/dev/null || echo missing)
            echo "health: $s"
            [ "$s" = healthy ] && exit 0
            sleep 5
          done
          docker logs --tail 50 keepeeassistant
          exit 1

      - name: Registry logout
        if: always()
        run: docker logout "$REGISTRY" || true
