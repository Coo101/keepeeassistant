[project]
name = "campmealplanner"
version = "0.1.0"
description = "Summer camp meal planner (see docs/SPEC.md)"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.18",
    "weasyprint==70.0",
    "whitenoise==6.12.0",
    "python-dotenv==1.2.4",
    "gunicorn==26.2.0",
    "pdfplumber==0.11.7",
    "markdown==3.8.2",
    "django-htmx==1.29.0",
    "django-crispy-forms==2.7",
    "crispy-bootstrap5==2026.9",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "ruff==0.17.3",
    "black==26.10.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]  # T20 bans print (SPEC §10)

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]  # Django's generated validator names run long

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = "migrations"
