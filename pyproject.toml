[project]
name = "campmealplanner"
version = "0.1.0"
description = "Summer camp meal planner (see docs/SPEC.md)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6",
    "weasyprint",
    "whitenoise",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "black",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]  # T20 bans print (SPEC §10)

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]  # Django's generated validator names run long

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = "migrations"
