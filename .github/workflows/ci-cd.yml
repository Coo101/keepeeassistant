# CI/CD for KeePeeAssistant (GitHub Actions).
#   test         — every push and PR: ruff, black, Django checks, pytest
#   branch-guard — PRs only: a PR into main must come from dev
#   build        — pushes to main: build the linux/arm64 image on an ARM runner, check it
#                  renders a PDF, push it to GHCR as :<sha> and :latest
#   deploy       — pushes to main, environment `hetzner-prod`: `ssh deploy@<host> <sha>`.
#                  The deploy key is forced to `deploy-app keepeeassistant` on the server,
#                  which runs compose pull + up with that tag (homelab repo: hetzner-prod/).
#                  Rollback: re-run an older successful run's deploy job.
# Environment `hetzner-prod` secrets:
#   KEEPEE_DEPLOY_KEY   private SSH key whose public half is in ~deploy/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS  the server's host key line(s) for known_hosts
#   DEPLOY_HOST         the server's address (kept out of the repo: the site is behind
#                       Cloudflare's proxy)
# The GHCR package must be public (or the server logged in to ghcr.io) so it can pull.
name: ci-cd

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # No secrets in CI: debug mode is the only way settings start without a key.
      DJANGO_DEBUG: "1"
      DJANGO_DATA_DIR: /tmp/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: ruff and black
        run: |
          ruff check .
          black --check .

      - name: Django checks
        run: |
          mkdir -p /tmp/data
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: pytest
        run: python -m pytest -q

  branch-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev may be merged into main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::A PR into main must come from dev, not '$HEAD'. Open it against dev instead."
            exit 1
          fi
          echo "ok: $HEAD -> $BASE"

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # hetzner-prod is ARM64 (CAX11): build natively instead of under QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name
        # GHCR wants lowercase names; the repo owner may have capitals.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Registry login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build
        run: |
          docker build --pull \
            --label org.opencontainers.image.revision=$GITHUB_SHA \
            --label org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .

      - name: Check the image renders PDFs
        run: |
          docker run --rm --entrypoint python "$IMAGE:$GITHUB_SHA" -c \
            "from weasyprint import HTML; assert HTML(string='<p>test</p>').write_pdf()[:4] == b'%PDF'"

      - name: Push
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Registry logout
        if: always()
        run: docker logout ghcr.io || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: hetzner-prod
    concurrency:
      group: deploy-hetzner-prod
      cancel-in-progress: false
    steps:
      - name: Check the environment secrets are set
        env:
          KEY: ${{ secrets.KEEPEE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for v in KEY KNOWN_HOSTS HOST; do
            [ -n "${!v}" ] || { echo "::error::Secret for $v is not set in the hetzner-prod environment (see the top of this file)"; exit 1; }
          done

      - name: Set up SSH
        env:
          KEY: ${{ secrets.KEEPEE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy (compose pull + up on the server)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        # The forced command ignores everything but the tag: it pulls and starts that image.
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$HOST" "$GITHUB_SHA"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
