<tr>
  {% for field in row.visible_fields %}
  <td>
    {% if forloop.first %}{% for hidden in row.hidden_fields %}{{ hidden }}{% endfor %}{{ row.non_field_errors }}{% endif %}
    {{ field }}{{ field.errors }}
  </td>
  {% endfor %}
</tr>
{% if total_forms %}<input type="hidden" name="{{ formset.prefix }}-TOTAL_FORMS" value="{{ total_forms }}" id="id_{{ formset.prefix }}-TOTAL_FORMS" hx-swap-oob="true">{% endif %}
