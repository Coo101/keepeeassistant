{% extends "base.html" %}
{% block title %}News — Camp Meal Planner{% endblock %}
{% block content %}
<h1>News</h1>
{% for post in posts %}
<article class="card">
  <h3><a href="{% url 'post_detail' post.slug %}">{{ post.title }}</a></h3>
  <p class="muted">{{ post.published_at|date:"d F Y" }}</p>
</article>
{% empty %}
<p class="empty-slot">No news yet.</p>
{% endfor %}
{% endblock %}
