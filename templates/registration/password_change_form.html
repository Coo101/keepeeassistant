{% extends "base.html" %}
{% block title %}Change password — Camp Meal Planner{% endblock %}
{% block content %}
<h1>Change password</h1>
<form method="post" class="stacked-form">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <div class="card">
    {% for field in form %}<div class="form-row">{{ field.as_field_group }}</div>{% endfor %}
  </div>
  <button class="btn" type="submit">Change password</button>
</form>
{% endblock %}
